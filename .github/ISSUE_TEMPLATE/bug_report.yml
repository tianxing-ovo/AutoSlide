name: 🐛 Bug 反馈
description: 提交应用运行中的崩溃、无响应、权限失效或异常问题
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交反馈！请务必完整填写以下必填信息，以便开发者快速定位。

  - type: input
    id: device_info
    attributes:
      label: 📱 手机品牌与型号
      placeholder: 例如：iQOO 12 / 小米 14 Pro / 华为 Mate 60
    validations:
      required: true

  - type: dropdown
    id: android_version
    attributes:
      label: 🤖 Android 系统与定制 ROM 版本
      options:
        - "Android 16 (OriginOS 5 / HyperOS 2 等)"
        - "Android 15"
        - "Android 14"
        - "Android 13"
        - "Android 12 及以下"
    validations:
      required: true

  - type: dropdown
    id: install_source
    attributes:
      label: 📦 安装方式与渠道
      options:
        - "GitHub Releases 签名包 (文件管理器/微信传输安装)"
        - "Android Studio / ADB 命令行安装"
        - "其他第三方应用市场"
    validations:
      required: true

  - type: dropdown
    id: affected_module
    attributes:
      label: ⚙️ 发生异常的功能模块
      options:
        - "无障碍服务开启 / 受限设置拦截"
        - "悬浮窗点击 / 拖拽 / 底板透明度"
        - "方向滑动执行 / 自定义手势轨迹"
        - "停顿模式 (固定时间 / 随机时间)"
        - "Shizuku 授权 / ADB 权限写入"
        - "检查更新 / APK 安装失败"
        - "其他"
    validations:
      required: true

  - type: input
    id: target_app
    attributes:
      label: 🎯 发生问题的目标应用 (选填)
      placeholder: 例如：微信、抖音、快手极速版、小红书、全部应用
    validations:
      required: false

  - type: textarea
    id: bug_desc
    attributes:
      label: 📝 问题详细描述
      placeholder: 请清晰描述遇到了什么异常（例如：在微信界面点击方向键没有反应、无障碍开关秒退等）
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: 🔄 详细复现步骤
      placeholder: |
        1. 打开 App 开启无障碍
        2. 点击开始弹出悬浮窗
        3. 切到 [微信/抖音/其他应用]
        4. 点击方向键...
    validations:
      required: true

  - type: textarea
    id: logs_or_screenshots
    attributes:
      label: 📷 截图或报错日志 (选填)
      placeholder: 可在此处粘贴截图、录屏或 ADB Logcat 报错日志
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: ⚠️ 提交前自查核对
      options:
        - label: 我确认已在【应用管理】中开启了「允许受限设置」（Android 13+ 必做）
          required: true
        - label: 我确认测试的是最新版本的 AutoSlide
          required: true
