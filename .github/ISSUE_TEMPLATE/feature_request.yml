name: 💡 功能建议
description: 提出对 AutoSlide 的新功能或改进建议
title: "[FEAT]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！请尽可能清晰地描述你希望实现的功能与实际解决的场景。

  - type: textarea
    id: feature_summary
    attributes:
      label: 💡 建议内容
      placeholder: 请清晰简要地描述你希望新增或优化的功能
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: 🎯 解决的具体使用场景与痛点
      placeholder: 请详细说明这个功能在什么具体场景下能带来帮助（例如：在刷特定任务时防止卡死）
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: 📝 补充说明或参考案例 (选填)
      placeholder: 任何其他补充信息、交互设计草图或参考软件案例
    validations:
      required: false
